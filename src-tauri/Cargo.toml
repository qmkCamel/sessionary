[package]
name = "sessionary"
version = "1.0.0"
description = "Local AI coding session ledger"
authors = ["Sessionary"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tauri = { version = "2", features = [] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
