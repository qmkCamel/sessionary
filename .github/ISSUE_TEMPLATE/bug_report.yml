name: Bug report
description: Report a reproducible Sessionary problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please remove private prompts, responses,
        source code, credentials, and local logs before submitting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Paste the app version or git commit.
      placeholder: 0.1.0 or abc1234
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Tauri desktop app
        - Browser preview
        - Tests
        - Other
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Data source
      options:
        - Codex logs
        - Claude Code logs
        - Fixture data
        - Fallback data
        - Unknown
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Trim or anonymize anything private.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private prompts, responses, source paths, credentials, and customer data.
          required: true
